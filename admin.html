
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administración | Cositas de Noe</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #fbf7f6;
      color: #493b3e;
    }

    main {
      max-width: 1000px;
      margin: 0 auto;
    }

    h1, h2 {
      color: #a75f76;
    }

    .panel, .login {
      background: white;
      padding: 24px;
      border-radius: 16px;
      margin: 20px 0;
      box-shadow: 0 4px 18px #0000000a;
    }

    .campo {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 14px;
    }

    input, select, textarea {
      width: 100%;
      padding: 11px;
      border: 1px solid #e3d4d7;
      border-radius: 8px;
      font: inherit;
    }

    textarea {
      resize: vertical;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 11px 16px;
      background: #a75f76;
      color: white;
      cursor: pointer;
      font-weight: bold;
      margin: 4px 4px 4px 0;
    }

    button.secundario {
      background: #eee5e7;
      color: #493b3e;
    }

    button.eliminar {
      background: #a63d4b;
    }

    .rejilla {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0 16px;
    }

    .producto {
      border: 1px solid #eee1e4;
      border-radius: 10px;
      padding: 14px;
      margin: 12px 0;
      overflow-wrap: anywhere;
    }

    .producto p {
      margin: 7px 0;
    }

    .estado {
      font-weight: bold;
    }

    .mensaje {
      margin: 12px 0;
      overflow-wrap: anywhere;
    }

    .ayuda {
      color: #786a6d;
      font-size: 0.9rem;
    }

    #panel {
      display: none;
    }

    @media (max-width: 600px) {
      body {
        padding: 12px;
      }

      .rejilla {
        grid-template-columns: 1fr;
      }

      .panel, .login {
        padding: 16px;
      }
    }
  </style>
</head>

<body>
  <main>
    <h1>Cositas de Noe</h1>
    <p>Panel de administración de tu tienda.</p>

    <section id="login" class="login">
      <h2>Iniciar sesión</h2>

      <form id="form-login">
        <div class="campo">
          <label for="email">Correo electrónico</label>
          <input id="email" type="email" required autocomplete="username">
        </div>

        
       
        <button type="submit">Ingresar</button>
      </form>

      <p id="mensaje-login" class="mensaje" role="status"></p>
    </section>

    <section id="panel">
      <div class="panel">
        <p id="usuario"></p>
        <button id="cerrar-sesion" type="button" class="secundario">
          Cerrar sesión
        </button>
      </div>

      <section class="panel">
        <h2 id="titulo-formulario">Agregar producto</h2>

        <form id="form-producto">
          <div class="rejilla">
            <div class="campo">
              <label for="nombre">Nombre del producto</label>
              <input id="nombre" required maxlength="150">
            </div>

            <div class="campo">
              <label for="marca">Marca</label>
              <select id="marca" required>
                <option value="Natura">Natura</option>
                <option value="Avon">Avon</option>
                <option value="Casa y Estilo">Casa y Estilo</option>
              </select>
            </div>

            <div class="campo">
              <label for="categoria">Categoría</label>
              <select id="categoria" required>
                <option value="">Seleccioná una categoría</option>
                <option value="Fragancias">Fragancias</option>
                <option value="Cuidado corporal">Cuidado corporal</option>
                <option value="Maquillaje">Maquillaje</option>
                <option value="Cuidado facial">Cuidado facial</option>
                <option value="Cuidado capilar">Cuidado capilar</option>
                <option value="Hogar">Hogar</option>
                <option value="Accesorios">Accesorios</option>
              </select>
            </div>
            <div class="campo">
              <label for="precio">Precio en pesos</label>
              <input id="precio" type="number" min="0" step="0.01" required>
            </div>

            <div class="campo">
              <label for="stock">Stock disponible</label>
              <input id="stock" type="number" min="0" step="1" required>
            </div>

            <div class="campo">
              <label for="imagen">Nombre del archivo de imagen</label>
              <input id="imagen" maxlength="255"
                     placeholder="Ej.: CremaPerayFlordeLoto.webp">
              <span class="ayuda">
                Escribí el nombre exacto del archivo que está en GitHub.
              </span>
            </div>
          </div>

          <div class="campo">
            <label for="descripcion">Descripción</label>
            <textarea id="descripcion" rows="3" maxlength="1000"></textarea>
          </div>

          <div class="campo">
            <label>
              <input id="activo" type="checkbox" checked
                     style="width:auto">
              Mostrar producto en la tienda
            </label>
          </div>

          <button id="guardar" type="submit">Guardar producto</button>
          <button id="cancelar-edicion" type="button"
                  class="secundario" hidden>
            Cancelar edición
          </button>

          <p id="mensaje-producto" class="mensaje" role="status"></p>
        </form>
      </section>

      <section class="panel">
        <h2>Mis productos</h2>
        <p class="ayuda">
          Podés editar los datos, cambiar el stock o eliminar un producto.
        </p>
        <div id="lista-productos"></div>
      </section>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
